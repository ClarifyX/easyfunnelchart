    <div class="container">
        <div class="main-grid">
            <!-- 左侧：数据输入 -->
            <div class="section">
                <div class="section-title" data-i18n="dataInput">Data Input</div>
                <div class="section-content">
                    <table>
                        <thead>
                            <tr>
                                <th>Event</th>
                                <th>Parameter</th>
                                <th data-i18n="action">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td><input type="text" value="Step 1" class="event-name" onchange="updateChart()"></td>
                                <td><input type="number" value="2000" class="event-value" onchange="updateChart()"></td>
                                <td><button class="delete-btn" onclick="deleteRow(this)" data-i18n="delete">Delete</button></td>
                            </tr>
                            <tr>
                                <td><input type="text" value="Step 2" class="event-name" onchange="updateChart()"></td>
                                <td><input type="number" value="1000" class="event-value" onchange="updateChart()"></td>
                                <td><button class="delete-btn" onclick="deleteRow(this)" data-i18n="delete">Delete</button></td>
                            </tr>
                            <tr>
                                <td><input type="text" value="Step 3" class="event-name" onchange="updateChart()"></td>
                                <td><input type="number" value="400" class="event-value" onchange="updateChart()"></td>
                                <td><button class="delete-btn" onclick="deleteRow(this)" data-i18n="delete">Delete</button></td>
                            </tr>
                        </tbody>
                    </table>
                    <button class="add-row-btn" onclick="addRow()" data-i18n="addRow">+ Add Stage</button>
                </div>
            </div>

            <!-- 右侧：图表预览 -->
            <div class="section">
                <div class="section-title" data-i18n="funnelPreview">Funnel Preview</div>
                <div class="section-content chart-container" id="chartContainer">
                    <div class="chart-wrapper">
                        <svg id="funnelChart" width="100%" height="100%" viewBox="0 0 800 500" style="min-height: 300px;"></svg>
                        <div class="chart-footer" data-i18n="chartLabel">easyfunnelchart.com</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Easy Funnel Chart © 2026 - 快速生成专业漏斗图</p>
    </footer>

    <script>
        const colors = ['#0066CC', '#0052A3', '#003D7A', '#002E5C', '#001F3D'];
        
        function getData() {
            const rows = document.querySelectorAll('#tableBody tr');
            return Array.from(rows).map(row => ({
                name: row.querySelector('.event-name').value || '未命名',
                value: parseInt(row.querySelector('.event-value').value) || 0
            })).filter(item => item.value > 0);
        }
        
        function updateChart() {
            const data = getData();
            const svg = document.getElementById('funnelChart');
            svg.innerHTML = '';
            
            if (data.length === 0) {
                svg.innerHTML = '<text x="400" y="250" text-anchor="middle" dy=".3em" fill="#9ca3af" font-size="16">' + i18nTexts[getLanguage()].emptyChart + '</text>';
                return;
            }
            
            const maxValue = Math.max(...data.map(d => d.value));
            const chartWidth = 600;
            const chartHeight = 45;
            const gap = 15;
            const startX = 100;  // 居中：(800 - 600) / 2 = 100
            const startY = 40;
            
            let prevPoints = null;
            
            data.forEach((item, index) => {
                const percentage = (item.value / maxValue) * 100;
                const width = (chartWidth * percentage) / 100;
                const x = startX + (chartWidth - width) / 2;
                const y = startY + index * (chartHeight + gap);
                
                // 绘制飘带
                if (prevPoints) {
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${prevPoints.x1} ${prevPoints.y1} Q ${(prevPoints.x1 + x) / 2} ${(prevPoints.y1 + y) / 2}, ${x} ${y} L ${x + width} ${y} Q ${(prevPoints.x2 + x + width) / 2} ${(prevPoints.y2 + y) / 2}, ${prevPoints.x2} ${prevPoints.y2} Z`;
                    path.setAttribute('d', d);
                    path.setAttribute('fill', 'rgba(0, 102, 204, 0.08)');
                    path.setAttribute('stroke', 'none');
                    svg.appendChild(path);
                }
                
                // 绘制数据柱
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', x);
                rect.setAttribute('y', y);
                rect.setAttribute('width', width);
                rect.setAttribute('height', chartHeight);
                rect.setAttribute('fill', colors[index % colors.length]);
                rect.setAttribute('rx', '4');
                rect.setAttribute('opacity', '0.95');
                svg.appendChild(rect);
                
                // 左侧文本（事件名称）
                const leftText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                leftText.setAttribute('x', x - 15);
                leftText.setAttribute('y', y + chartHeight / 2);
                leftText.setAttribute('text-anchor', 'end');
                leftText.setAttribute('dy', '0.3em');
                leftText.setAttribute('font-size', '14');
                leftText.setAttribute('font-weight', '500');
                leftText.setAttribute('fill', '#1f2937');
                leftText.textContent = item.name;
                svg.appendChild(leftText);
                
                // 右侧文本（百分比）
                const rightText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                rightText.setAttribute('x', x + width + 15);
                rightText.setAttribute('y', y + chartHeight / 2);
                rightText.setAttribute('dy', '0.3em');
                rightText.setAttribute('font-size', '14');
                rightText.setAttribute('font-weight', '600');
                rightText.setAttribute('fill', '#0066cc');
                rightText.textContent = percentage.toFixed(1) + '%';
                svg.appendChild(rightText);
                
                prevPoints = {
                    x1: x,
                    y1: y + chartHeight,
                    x2: x + width,
                    y2: y + chartHeight
                };
            });
        }
        
        function addRow() {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            const lang = getLanguage();
            row.innerHTML = `
                <td><input type="text" value="${i18nTexts[lang].newEvent}" class="event-name" onchange="updateChart()"></td>
                <td><input type="number" value="0" class="event-value" onchange="updateChart()"></td>
                <td><button class="delete-btn" onclick="deleteRow(this)" data-i18n="delete">Delete</button></td>
            `;
            tbody.appendChild(row);
            updateChart();
        }
        
        function deleteRow(btn) {
            btn.closest('tr').remove();
            updateChart();
        }
        
        function exportChart() {
            const svg = document.getElementById('funnelChart');
            
            // Get SVG viewBox
            const viewBox = svg.getAttribute('viewBox');
            const [, , vbWidth, vbHeight] = viewBox.split(' ').map(Number);
            
            // Create new SVG with chart and text
            const exportSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            exportSvg.setAttribute('width', vbWidth);
            exportSvg.setAttribute('height', vbHeight + 80);
            exportSvg.setAttribute('viewBox', `0 0 ${vbWidth} ${vbHeight + 80}`);
            exportSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            
            // Add white background
            const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bg.setAttribute('width', vbWidth);
            bg.setAttribute('height', vbHeight + 80);
            bg.setAttribute('fill', '#ffffff');
            exportSvg.appendChild(bg);
            
            // Clone original SVG content
            const svgClone = svg.cloneNode(true);
            exportSvg.appendChild(svgClone);
            
            // Add footer text
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', vbWidth / 2);
            text.setAttribute('y', vbHeight + 50);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('font-size', '14');
            text.setAttribute('fill', '#6b7280');
            text.setAttribute('font-family', 'Inter, -apple-system, BlinkMacSystemFont, sans-serif');
            text.textContent = 'easyfunnelchart.com';
            exportSvg.appendChild(text);
            
            // Convert to PNG
            const svgData = new XMLSerializer().serializeToString(exportSvg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            const scale = 2;
            canvas.width = vbWidth * scale;
            canvas.height = (vbHeight + 80) * scale;
            
            const img = new Image();
            img.onload = () => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'funnel-chart.png';
                    link.click();
                    URL.revokeObjectURL(url);
                });
            };
            
            img.onerror = () => {
                console.error('Failed to load SVG image');
            };
            
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            img.src = URL.createObjectURL(blob);
        }
        
        // Initialize
        updateChart();
    </script>
</body>
</html>
